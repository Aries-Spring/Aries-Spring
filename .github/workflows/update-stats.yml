name: Update Game Stats

# Optional workflow to update README with additional game statistics
# Note: Basic stats are already real-time via shields.io badges in README
# This workflow can be enabled if you want to track additional metrics

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Calculate Game Stats
        id: stats
        run: |
          # Count active games (issues with game-active label)
          ACTIVE_GAMES=$(gh issue list --label "game-active" --state open --json number --jq 'length' || echo "0")
          
          # Count total game issues (all issues with game-active label, including closed)
          TOTAL_GAMES=$(gh issue list --label "game-active" --state all --json number --jq 'length' || echo "0")
          
          echo "active_games=$ACTIVE_GAMES" >> $GITHUB_OUTPUT
          echo "total_games=$TOTAL_GAMES" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README Stats
        # This step is optional - uncomment if you want to update README with calculated stats
        # The shields.io badges already provide real-time stats, so this is only for additional metrics
        run: |
          echo "Stats calculated:"
          echo "Active Games: ${{ steps.stats.outputs.active_games }}"
          echo "Total Games: ${{ steps.stats.outputs.total_games }}"
          # Uncomment below to actually update README
          # sed -i "s/<!-- ACTIVE_GAMES -->.*<!-- \/ACTIVE_GAMES -->/<!-- ACTIVE_GAMES -->${{ steps.stats.outputs.active_games }}<!-- \/ACTIVE_GAMES -->/g" README.md
          # git config user.name "github-actions[bot]"
          # git config user.email "github-actions[bot]@users.noreply.github.com"
